<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="900" height="320" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">ClaimFlow — LangGraph Pipeline</text>

  <!-- Domain badge row -->
  <rect x="210" y="52" width="80" height="20" rx="4" fill="#1e3a5f"/>
  <text x="250" y="66" text-anchor="middle" fill="#60a5fa" font-size="10">Health</text>
  <rect x="305" y="52" width="80" height="20" rx="4" fill="#1e3a5f"/>
  <text x="345" y="66" text-anchor="middle" fill="#60a5fa" font-size="10">Property</text>
  <rect x="400" y="52" width="80" height="20" rx="4" fill="#1e3a5f"/>
  <text x="440" y="66" text-anchor="middle" fill="#60a5fa" font-size="10">Loan</text>

  <!-- Nodes -->
  <!-- Ingest -->
  <rect x="40" y="120" width="120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Ingest</text>
  <text x="100" y="162" text-anchor="middle" fill="#64748b" font-size="10">deterministic</text>
  <text x="100" y="175" text-anchor="middle" fill="#64748b" font-size="9">OCR fallback</text>

  <!-- Extract -->
  <rect x="210" y="120" width="120" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Extract</text>
  <text x="270" y="162" text-anchor="middle" fill="#93c5fd" font-size="10">LLM ✦</text>
  <text x="270" y="175" text-anchor="middle" fill="#64748b" font-size="9">confidence per field</text>

  <!-- Validate -->
  <rect x="380" y="120" width="120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Validate</text>
  <text x="440" y="162" text-anchor="middle" fill="#64748b" font-size="10">deterministic</text>
  <text x="440" y="175" text-anchor="middle" fill="#64748b" font-size="9">domain rules</text>

  <!-- Retrieve -->
  <rect x="550" y="120" width="120" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="610" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Retrieve</text>
  <text x="610" y="162" text-anchor="middle" fill="#93c5fd" font-size="10">LLM ✦</text>
  <text x="610" y="175" text-anchor="middle" fill="#64748b" font-size="9">Qdrant + reranker</text>

  <!-- Review -->
  <rect x="720" y="120" width="120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="780" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Review</text>
  <text x="780" y="162" text-anchor="middle" fill="#64748b" font-size="10">deterministic</text>
  <text x="780" y="175" text-anchor="middle" fill="#64748b" font-size="9">threshold routing</text>

  <!-- Arrows: Ingest → Extract -->
  <line x1="160" y1="150" x2="210" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Extract → Validate -->
  <line x1="330" y1="150" x2="380" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Validate → Retrieve (conditional, failures) -->
  <line x1="500" y1="150" x2="550" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="525" y="143" text-anchor="middle" fill="#64748b" font-size="9">failures</text>
  <!-- Retrieve → Review -->
  <line x1="670" y1="150" x2="720" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Validate → Review (skip, no failures) -->
  <path d="M440 120 L440 100 L780 100 L780 120" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="610" y="96" text-anchor="middle" fill="#64748b" font-size="9">no failures (skip retrieve)</text>

  <!-- Decision outputs -->
  <rect x="700" y="220" width="80" height="26" rx="4" fill="#14532d"/>
  <text x="740" y="237" text-anchor="middle" fill="#4ade80" font-size="11">approved</text>
  <rect x="790" y="220" width="70" height="26" rx="4" fill="#78350f"/>
  <text x="825" y="237" text-anchor="middle" fill="#fb923c" font-size="11">flagged</text>
  <rect x="745" y="256" width="76" height="26" rx="4" fill="#3b0764"/>
  <text x="783" y="273" text-anchor="middle" fill="#c084fc" font-size="11">escalated</text>

  <line x1="780" y1="180" x2="780" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="780" y1="200" x2="825" y2="220" stroke="#475569" stroke-width="1"/>
  <line x1="780" y1="210" x2="783" y2="256" stroke="#475569" stroke-width="1"/>

  <!-- Legend -->
  <rect x="40" y="260" width="12" height="12" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="271" fill="#94a3b8" font-size="10">LLM node (2 of 5)</text>
  <rect x="160" y="260" width="12" height="12" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="178" y="271" fill="#94a3b8" font-size="10">Deterministic node (3 of 5)</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
