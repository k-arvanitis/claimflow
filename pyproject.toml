[project]
name = "claimflow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "doc-intel",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "qdrant-client[fastembed]>=1.12.0",
    "sentence-transformers>=3.3.0",
    "fpdf2>=2.8.0",
    "pydantic-settings>=2.7.0",
    "langfuse>=2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
doc-intel = { path = "../doc-intel", editable = true }

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimflow"]
