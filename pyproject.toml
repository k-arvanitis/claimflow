[project]
name = "claimflow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "doc-intel[ocr]",
    "langgraph>=0.2.0",
    "anthropic>=0.105.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "qdrant-client[fastembed]>=1.12.0",
    "sentence-transformers>=3.3.0",
    "fpdf2>=2.8.0",
    "pydantic-settings>=2.7.0",
    "langfuse>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.32",
    "streamlit>=1.58.0",
    "rapidfuzz>=3.0.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
eval-real-public = [
    "datasets>=5.0.0",
    "openpyxl>=3.1.5",
]

[tool.uv.sources]
doc-intel = { path = "../doc-intel", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimflow"]
