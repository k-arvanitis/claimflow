name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest tests/ -v --ignore=tests/test_api.py
        env:
          ANTHROPIC_API_KEY: test-key
          DOC_INTEL_PROVIDER: anthropic
          DOC_INTEL_MODEL: claude-sonnet-4-6
